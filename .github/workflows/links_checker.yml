name: Links Checker

on:
  ## Allow triggering this workflow manually via GitHub CLI/web
  workflow_dispatch:

  ## Run this workflow automatically every month
  schedule:
    - cron: '0 0 1 * *'

## Only what the job needs: read the repo, write the report issue
permissions:
  contents: read
  issues: write

jobs:
  link_checker:
    name: Check links and create automated issue if needed
    runs-on: ubuntu-latest
    env:
      REPORT_FILE: links-report
    steps:
      ## Check out code using Git
      ## Actions are pinned to a full commit SHA; the comment shows the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check all links at README.md but skips translations files
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          output: ${{ env.REPORT_FILE }}
          format: markdown
          ## Do not fail this step on broken links
          fail: false
          failIfEmpty: false
          ## Allow pages replying with 200 (Ok), 204 (No Content),
          ## 206 (Partial Content) in at most 20 seconds with HTML content.
          ## max-concurrency was 20, getting network errors
          args: >-
            --verbose
            --accept 200,204,206
            --header "Accept: text/html"
            --timeout 20
            --max-concurrency 3
            --no-progress
            README.md
        env:
          ## Avoid rate limiting when checking github.com links
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lychee's exit code
        ## https://github.com/lycheeverse/lychee#exit-codes
        run: echo Lychee exit with ${{ steps.lychee.outputs.exit_code }}

      - name: Find the last report issue open
        id: last_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label report --label "automated issue" --search "sort:updated-desc" --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "has_found=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "has_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue from report file
        ## Only write a report when there are broken links
        if: ${{ steps.last_issue.outputs.has_found == 'false' && steps.lychee.outputs.exit_code != 0 }}
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link checker report
          content-filepath: ${{ env.REPORT_FILE }}
          issue-number: ${{ steps.last_issue.outputs.issue_number }}
          labels: |
            report
            automated issue

      - name: Update last report open issue created
        if: ${{ steps.last_issue.outputs.has_found == 'true' && steps.lychee.outputs.exit_code != 0 }}
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link checker report
          content-filepath: ${{ env.REPORT_FILE }}
          issue-number: ${{ steps.last_issue.outputs.issue_number }}
          labels: |
            report
            automated issue

      - name: Close last report open issue
        if: ${{ steps.lychee.outputs.exit_code == 0 && steps.last_issue.outputs.has_found == 'true' }}
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.last_issue.outputs.issue_number }}
